name: Deploy to GitHub Pages

on:
  push:
    # Under projektet (vecka 6-10) arbetar vi i en dev branch. Utan dev här
    # skulle den driftsatta sidan stå kvar på vecka 5-koden hela projektet,
    # branches planering jag och tommy har planerat till:
    #   dev + andra krav branches  = det som körs och demonstreras under projektet
    #   main = den släppta versionen
    #
    branches: [main, dev]

  # Gör att workflowet kan köras manuellt från Actions-fliken
  workflow_dispatch:

# Rättigheter som actions/deploy-pages behöver
permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bygg produktionsbygget
        run: npm run build
        env:


          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Ladda upp bygget som Pages-artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
